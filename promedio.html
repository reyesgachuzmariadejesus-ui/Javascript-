<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promedio</title>
</head>
<body>
    <h1>PROMEDIO</h1>
    <script>
       let nombre = prompt("Ingresa tu nombre:");
       let asignatura = prompt("Ingresa tu asignatura:");
       let promedio = parseFloat(prompt("Ingresa tu promedio:"));

       if(promedio >= 6 ){
        document.write("Tu Nombre es:" + nombre + "<br>");
        document.write("Tu Asignatura es:" + asignatura + "<br>");
        document.write("Aprobaste" + promedio);
       }else{
        console.log("Esfuerzate mas");
       }
    </script>

</body>
</html>
