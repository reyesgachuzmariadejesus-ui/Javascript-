<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Laboratorio</h1>
    <script>
        let semestre = Number(prompt("Ingresa tu semestre:"));
        
        switch (semestre) {
        case 1:
            document.write(" no llevas programación");
            break;

        case 2:
        case 3:
        case 4:
            document.write(" tienes que ir a los laboratorios 1 o 2");
            break;

        case 5:
        case 6:
            document.write(" tienes que ir al laboratorio 3");
            break;

        default:
            document.write("Semestre no válido");
            break;
    }
    
    </script>
</body>
</html>
