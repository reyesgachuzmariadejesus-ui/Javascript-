<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const numeros = [10, 20, 30, 40];
        let i = 0;
        let suma = 0;

      do {
         suma += numeros[i];
          i++;
       } while (i < numeros.length);

      document.write("La suma total es: " + suma);
    </script>
</body>
</html>
