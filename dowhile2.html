<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const frutas = ["manzana", "pera", "plátano", "uva"];
        let i = 0;

      do {
         document.write("Fruta: " + frutas[i] + "<br>");
         i++;
       } while (i < frutas.length);
    </script>
</body>
</html>
